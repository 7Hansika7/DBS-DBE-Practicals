<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="w-full h-full">
  <defs>
    <!-- Central optic core glowing gradient -->
    <radialGradient id="opticCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <!-- Cyan Cyber Accent Gradient -->
    <linearGradient id="cyberEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- CCTV Metallic Casing Gradient -->
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CCTV Lens Housing / Octagonal Cyber Perimeter Brackets -->
  <polygon points="20,6 44,6 58,20 58,44 44,58 20,58 6,44 6,20" fill="url(#casingGrad)" stroke="url(#cyberEdge)" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Precision Corner Targeting Ticks -->
  <path d="M12 12L17 12M12 12L12 17" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 12L47 12M52 12L52 17" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 52L17 52M12 52L12 47" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 52L47 52M52 52L52 47" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

  <!-- Crosshair Reticle Quadrant Ticks -->
  <line x1="32" y1="2" x2="32" y2="10" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="54" x2="32" y2="62" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="32" x2="10" y2="32" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="32" x2="62" y2="32" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer Optic Sensor Ring -->
  <circle cx="32" cy="32" r="21" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Odin Cybernetic Eye Shape (Stylized Almond Eye Arch) -->
  <path d="M11 32 C17 21, 25 17, 32 17 C39 17, 47 21, 53 32 C47 43, 39 47, 32 47 C25 47, 17 43, 11 32 Z" 
        stroke="#22d3ee" stroke-width="2.2" fill="#020617" fill-opacity="0.6"/>

  <!-- Iris Aperture Blades Disc -->
  <circle cx="32" cy="32" r="11.5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 2"/>
  
  <!-- Central Glowing Optic Core / Camera Sensor -->
  <circle cx="32" cy="32" r="8" fill="url(#opticCore)"/>
  
  <!-- Inner Iris Pupil -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Optical Camera Glint / Specular Arc -->
  <path d="M25 25 A 9 9 0 0 1 35 25" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- CCTV Active Recording Telemetry Dot -->
  <circle cx="48" cy="16" r="2.5" fill="#ef4444" filter="url(#neonGlow)"/>
  <circle cx="48" cy="16" r="1.2" fill="#ffffff"/>
</svg>
